# Fly.io config — Empório Pet Web (Next.js frontend)
# Deploy via GitHub Actions (.github/workflows/deploy-vet-crm.yml)
# Cintia: precisa gerar app primeiro via `fly apps create emporio-pet-web -o emporio-do-pet-administracao`

app = "emporio-do-web"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 3000
  force_https = true
  # 'off' = a máquina NUNCA desliga por ociosidade. Igual ao backend (que protege o
  # atendimento com auto_stop=off). Motivo (04/08/2026): com "stop" a única máquina
  # do frontend desligava ociosa e, num dia de Fly sem capacidade em gru, NÃO conseguia
  # religar -> "could not find a good candidate" -> app fora pra todos (ninguém entrava).
  auto_stop_machines = "off"
  auto_start_machines = true
  # 2 máquinas sempre ligadas (igual ao backend) — redundância: se uma engasga, a
  # outra segura o app no ar. Sem isso, a máquina única virava ponto de falha (04/08/2026).
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/"

[[vm]]
  # 1GB dá fôlego pro Next.js (SSR) — com 512MB a máquina sufocava sob carga e falhava
  # o health check da porta 3000 (04/08/2026), gerando quedas intermitentes.
  memory = "1024mb"
  cpu_kind = "shared"
