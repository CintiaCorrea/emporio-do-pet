# =====================================================
# Fly.io Configuration - Empório do Pet Backend
# =====================================================
# Deploy: fly deploy
# Logs: fly logs
# SSH: fly ssh console
# =====================================================

app = "emporio-pet-api"
primary_region = "gru"  # São Paulo, Brasil

[build]
  dockerfile = "Dockerfile"

[env]
  META_PAGE_ID = "264757673573802"
  META_AD_ACCOUNT_ID = "act_1540879966657176"
  NODE_ENV = "production"
  PORT = "8080"
  AI_SERVICE_URL = "http://emporio-pet-ai.internal:8080"
  FRONTEND_URL = "https://emporiodopet.com.br"

# =====================================================
# DOIS PAPÉIS, O MESMO CÓDIGO E O MESMO DEPLOY (03/09/2026)
# =====================================================
# Antes UMA máquina fazia as duas coisas: atender as telas E rodar as 32 rotinas
# automáticas (lembretes, confirmação de agenda, polling do BotConversa, financeiro
# de 30 em 30 min, fechamento de caixa, boletins...). Quando uma rotina pesada rodava,
# a recepcionista esperava no balcão — disputavam o mesmo processador.
#
#   app    → atende as telas. NENHUMA rotina roda aqui.
#   worker → roda as rotinas. NÃO recebe requisição de ninguém.
#
# Quem desliga as rotinas no "app" é o CronLeaderService, lendo FLY_PROCESS_GROUP
# (a Fly define sozinha a cada boot). Não usa mais número de série de máquina —
# esse era o defeito que parou todas as rotinas em 10/08/2026.
[processes]
  app = "node dist/main"
  worker = "node dist/main"

[http_service]
  internal_port = 8080
  force_https = true
  # Duas máquinas SEMPRE ligadas: protege o atendimento de WhatsApp. Com isso os deploys
  # rolam uma máquina de cada vez (a outra segue atendendo) e, se uma cair, a outra segura.
  # 'off' = a Fly não desliga a extra por ociosidade (senão voltaria a uma só).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/api/health"

# Release command - sync schema + pgvector setup
# 1. prisma db push: cria/sincroniza tabelas (ignora campos Unsupported como embedding)
# 2. prisma db execute: aplica extensão pgvector, coluna embedding e índice HNSW
#
# ⚠️ SEM --accept-data-loss (03/09/2026). Antes ele estava aqui e autorizava o deploy a
# APAGAR dados do banco de produção para fazer o banco caber no desenho do código — sozinho,
# a cada deploy, sem perguntar. Bastava alguém remover um campo do schema pra coluna sumir
# em produção. Sem a flag, um deploy que exigiria destruir dado FALHA em vez de executar
# calado: a gente descobre antes, não depois. Se um deploy parar aqui, NÃO recoloque a flag —
# olhe o que ele quer destruir primeiro.
[deploy]
  release_command = "sh -c 'npx prisma db execute --file prisma/pgvector_extension.sql --schema prisma/schema.prisma && npx prisma db push && npx prisma db execute --file prisma/pgvector_setup.sql --schema prisma/schema.prisma'"

# Machine configuration — uma linha por papel.
# O "app" mantém o que já existia (CPU dedicada, 2 GB), agora em DUAS máquinas.
# O "worker" é mais modesto de propósito: rotina não tem gente esperando do outro lado,
# então segundos a mais não incomodam ninguém. Se o monitor de automações
# (GET /api/health/automations) começar a acusar atraso, é aqui que se aumenta.
[[vm]]
  processes = ["app"]
  memory = "2gb"
  cpu_kind = "performance"
  cpus = 1

[[vm]]
  processes = ["worker"]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

